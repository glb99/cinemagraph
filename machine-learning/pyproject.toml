[project]
name = "machine-learning-service"
version = "0"
description = "Isolated FastAPI wrapper around CLIPSeg for cinemagraph-tool's semantic masking."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0,<3",
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
