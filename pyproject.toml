[build-system]
# >=77, not >=68, because the `license`/`license-files` fields below are PEP 639
# (an SPDX expression plus explicit file globs), which setuptools only understands
# from 77 on. The older `license = {text = "..."}` table plus a `License ::`
# classifier is the alternative, and it's the deprecated one -- PyPI no longer
# wants those classifiers, and combining them with an SPDX expression is an error.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemagraph"
version = "0.1.0"
description = "Turn a short video or photo into a looping lofi cinemagraph."
requires-python = ">=3.11"
authors = [{ name = "Guillermo" }]
readme = "README.md"
# Apache-2.0 rather than MIT for the patent grant (sec 3 -- this project sits in
# diffusion-model and video-codec territory, where patents genuinely exist) and
# for the explicit contribution terms in sec 5, which make a drive-by PR's
# licensing unambiguous without needing a CLA. See docs/OPEN-SOURCE-READINESS.md.
#
# Scope note: this covers *this repo's code only*. Model weights pulled at
# runtime (SDXL, Stable Audio Open, CLIPSeg) and anything generated with them are
# governed by their own licenses -- see the README's Licensing section.
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    # No "License ::" classifier here on purpose: PEP 639 forbids pairing one
    # with the SPDX `license` field above.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python-headless>=4.9.0,<5",
    "numpy>=1.26.0,<3",
    "click>=8.1.0,<9",
    "imageio>=2.34.0,<3",
    "imageio-ffmpeg>=0.4.9,<1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27.0,<1",
    "pydantic-settings>=2.2.0,<3",
]
# Light sibling module (sec 3.2's "generation/ (planned, API-backend case)" row) --
# its own extra, not folded into `server`, so a deployment that only wants the
# self-hosted SDXL/ACE-Step/Stable-Audio backends never pulls in google-genai.
generation = [
    "google-genai>=2.16.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "httpx>=0.27.0,<1",
    "ruff>=0.2.2,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ty>=0.0.25",
    "prek>=0.4.11,<1.0.0",
    "zizmor>=1.0.0",
]

[project.scripts]
cinemagraph = "cinemagraph.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live deployed stack (docker compose up) and, for most cases, a real GPU-backed service. Excluded from the default run -- see docs/DESIGN.md sec 3.7.",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
# E501: line length -- not worth the churn on a codebase with no prior formatting pass.
# B008: FastAPI's Depends(...)-in-default-argument pattern is idiomatic, not a bug.
# W191/B904: match this codebase's existing style rather than forcing a
# app-code-wide rewrite as a side effect of adopting a linter.
ignore = ["E501", "B008", "W191", "B904"]

[tool.mypy]
# Matches the interpreter actually used to run mypy (.python-version), not
# requires-python's floor (3.11) -- numpy's bundled stubs use 3.12+ syntax
# (PEP 695 `type` statements) that mypy can't even parse under python_version
# 3.11, which aborted type checking entirely before this was raised to 3.13.
python_version = "3.13"
warn_unused_ignores = true
# Non-strict to start: no existing type-hint baseline to assume `strict = true`
# is reachable in one pass. Revisit once `uv run mypy src`'s real error count is known.

[tool.ty.terminal]
error-on-warning = true

[tool.typos.default.extend-words]
# typos-crate tokenizes "PNGs" as "PN" + "Gs" and misreads "PN" as a typo of
# "ON" -- false positive, not a real spelling issue.
PN = "PN"
