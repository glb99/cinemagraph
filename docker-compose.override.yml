# Auto-merged by `docker compose up`/`watch` -- no extra flags needed beyond
# the `--watch` flag itself (or the standalone `docker compose watch` command).
# This is Docker Compose's own officially documented live-development
# mechanism (docs.docker.com/compose/how-tos/file-watch/), replacing an
# earlier bind-mount + `uvicorn --reload` setup that had a real, observed
# failure mode: `uvicorn --reload`'s file-watcher (`watchfiles`, a Rust
# extension) runs *inside* the same container process as the app, and it
# crashed with `Cannot allocate memory` under the memory pressure of a real
# render, taking the whole server down with it, not just the reload
# mechanism. Compose Watch's own file-watching runs on the host, via the
# Compose CLI itself -- never inside the container -- so there's no
# in-container watcher process left to crash under render-induced memory
# pressure. See docs/experiments/2026-07-28-docker-dev-reload.md's
# follow-up sections for both incidents and how each was found/fixed.
#
# sync+restart re-copies changed files into /app/src and restarts the `core`
# container so uvicorn picks them up -- this replaces both the old bind
# mount (sync already gets files in) and the manual `docker compose restart
# core` step (the restart is now automatic). rebuild re-builds the image
# when a dependency file changes, same as the manual `docker compose build
# core` this project has always needed for that case, just no longer
# something to remember by hand.
#
# .dockerignore's patterns (__pycache__/, *.pyc, etc.) apply automatically
# to `ignore` here too -- Compose loads them as implicit ignore content.
#
# Only covers the `core` service. machine-learning/ and sound-effects/ are
# edited far less often and carry heavy, slow-to-rebuild dependencies
# (torch et al.) -- add an equivalent block there too if that changes.
services:
  core:
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # Dev-mode Vite server, kept as its own service/image rather than bundled
  # into `core` (unlike full-stack-fastapi-template's single-image approach)
  # -- `core` is already a multi-service, GPU-adjacent image, and the
  # frontend runs in dev mode only, so there's no built bundle to bake in.
  # Unprofiled (always up under a plain `docker compose up`, same as `core`)
  # -- the profile-gated services below are the GPU-heavy satellites, this
  # isn't one of them.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # `core`, not `localhost` -- this runs inside the Compose network, so
      # `localhost` would resolve to the frontend container itself. Bare-metal
      # local dev (bun run dev directly on the host) relies on
      # vite.config.ts's own default (http://localhost:8000) instead.
      - VITE_API_PROXY_TARGET=http://core:8000
    depends_on:
      - core
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
