services:
  core:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - CINEMAGRAPH_DATA_DIR=/data
      # Uncomment once machine-learning (below) actually exists:
      # - ML_SERVICE_URL=http://machine-learning:8001
      # Uncomment once you're running the acestep service (below):
      # - ACESTEP_URL=http://acestep:8001

  # Stub -- machine-learning/ currently only has a README documenting the
  # intended contract (POST /segment {image, prompt} -> mask.png), no
  # Dockerfile or code yet. This entry reserves the seam: `core` degrades
  # gracefully (GET /capabilities -> semantic_mask: false, POST /mask/semantic
  # -> 503) whenever ML_SERVICE_URL isn't set, which is the default. Once
  # this service is built, uncomment this and the ML_SERVICE_URL line above,
  # then run `docker compose --profile ml up`.
  # machine-learning:
  #   build: ./machine-learning
  #   profiles: ["ml"]
  #   ports:
  #     - "8001:8001"

  # ACE-Step's own published image, referenced directly -- not vendored,
  # not built by us. Unlike machine-learning/, there's no wrapper for us to
  # write here at all: ACE-Step already ships its own FastAPI server (see
  # api/app.py's /generate/music, which is a client of exactly this). Needs
  # a GPU and a model download on first start (checkpoints/ volume caches
  # it across restarts). Uncomment plus the ACESTEP_URL line above, then
  # `docker compose --profile audio up`.
  # acestep:
  #   image: ghcr.io/ace-step/ace-step-1.5:latest
  #   profiles: ["audio"]
  #   environment:
  #     - ACESTEP_MODE=api
  #   ports:
  #     - "8002:8001"
  #   volumes:
  #     - ./data/acestep-checkpoints:/app/checkpoints
  #     - ./data/acestep-hf-cache:/root/.cache/huggingface
  #   shm_size: "2gb"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
