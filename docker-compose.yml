services:
  core:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - CINEMAGRAPH_DATA_DIR=/data
      # Without this, the asset library defaults to ~/.cinemagraph/library inside
      # the container's own filesystem -- nowhere host-mounted -- so it survives a
      # `restart` but is silently wiped by `docker compose down` + `up` (container
      # removed and recreated), defeating the whole point of a *persistent* library.
      # Pointing it at a subdirectory of the already-mounted /data fixes that with
      # no new volume needed. Independent of CINEMAGRAPH_DATA_DIR at the code level
      # (see server/config.py) -- this just happens to put both under the same
      # host-mounted folder in this one deployment.
      - CINEMAGRAPH_LIBRARY_DIR=/data/library
      # Uncomment once you're running the machine-learning service (below):
      # - ML_SERVICE_URL=http://machine-learning:8004
      - ACESTEP_URL=http://acestep:8001
      # Alternative: ACE-Step running natively on the host instead of the
      # `acestep` container below (e.g. if you'd rather not duplicate GPU
      # residency across two processes). `host.docker.internal` is Docker
      # Desktop's standard route from a container back to the host. Start it
      # with `uv run acestep-api` from an ACE-Step-1.5 checkout first.
      # - ACESTEP_URL=http://host.docker.internal:8001
      - SOUND_EFFECTS_URL=http://sound-effects:8003
      - IMAGE_GENERATION_URL=http://image-generation:8005
      # Hosted, not a satellite container -- unlike every URL above, this is
      # a secret, read from the root .env file via Compose's own ${VAR}
      # substitution (gitignored, never committed). Absent -> GeminiAdapter
      # just never registers (server/app.py), same "not configured -> not
      # offered" degrade every other optional capability already follows.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  # machine-learning/ -- CLIPSeg (via transformers), same shape as
  # sound-effects/ below: built, own pyproject/Dockerfile, `core` still
  # degrades gracefully (GET /capabilities -> semantic_mask: false, POST
  # /mask/semantic -> 503) whenever ML_SERVICE_URL is unset. CPU-capable
  # per its Dockerfile, faster with a GPU. `docker compose --profile ml up`.
  machine-learning:
    build: ./machine-learning
    profiles: ["ml"]
    ports:
      - "8004:8004"
    volumes:
      - ./data/machine-learning-cache:/cache/huggingface

  # ACE-Step's own published image, referenced directly -- not vendored, not
  # built by us. Unlike machine-learning/, there's no wrapper for us to write
  # here at all: ACE-Step already ships its own FastAPI server (see
  # server/app.py's /generate/music, which is a client of exactly this).
  # Validated 2026-07-29/30 (see docs/experiments/), across two real findings.
  #
  # First: bind-mounting a *different, already-populated* ACE-Step-1.5
  # checkout's checkpoints/ directly in (an absolute Windows path) hung
  # permanently on the first request -- confirmed via `cat /proc/<pid>/wchan`
  # -> `p9_client_rpc`, Docker Desktop's WSL2 cross-OS file-sharing protocol,
  # with the GPU sitting idle. First fix attempt: switch to a *project-relative*
  # bind mount instead (./data/acestep-checkpoints), reasoning that
  # sound-effects/image-generation use that same style successfully.
  #
  # Second finding: that "fix" was incomplete. It worked once, immediately
  # after the container's own fresh download into that directory -- but a
  # later cold container restart, reading those same now-pre-existing files
  # back from the same bind mount, hung with the *exact same*
  # `p9_client_rpc` wchan. The real trigger isn't "pre-populated by a
  # different project" vs. "downloaded by this container" -- it's reading a
  # large file cold (not already in the container's page cache) through
  # Docker Desktop's WSL2 bridge at all, regardless of which path or who
  # wrote it. sound-effects/image-generation may simply not have been
  # restart-tested cold in this same way; this isn't confirmed to be
  # ACE-Step-specific.
  #
  # Actual fix: named Docker volumes (`acestep-checkpoints`/`acestep-hf-cache`
  # below) instead of any Windows-path bind mount. A named volume's storage
  # lives natively inside the Docker Desktop WSL2 VM's own Linux filesystem --
  # never crosses the Windows/WSL2 9P bridge at all, so this class of hang
  # structurally can't happen. Trade-off: the checkpoints aren't browsable
  # from Windows Explorer the way ./data/* is; `docker volume inspect
  # cinemagraph-tool_acestep-checkpoints` finds the real path if needed.
  # First run downloads ~11GB into the volume, cached across restarts.
  #
  # ACESTEP_NO_INIT=false forces eager loading at startup: found a third
  # real cold-start issue after the two above. ACE-Step's own
  # `ensure_models_initialized` runs its (slow) model-loading code inline on
  # the asyncio event loop with no await-worthy operation -- not offloaded
  # to a thread the way its own generation step is two lines away in the
  # same codebase -- so the *entire server*, including the cheap
  # /query_result status check, goes unresponsive for as long as loading
  # takes. Thinking mode makes this worse: the first-ever request needing
  # the LM pays vLLM's torch.compile warm-up too (tokenizer load alone timed
  # at 46s in one run), comfortably past call_optional_service's timeout.
  # Eager loading moves that whole cost to `docker compose up` (a slower
  # startup, once) instead of a random user-facing request.
  #
  # Note ACESTEP_NO_INIT, not ACESTEP_INIT_SERVICE -- an earlier attempt set
  # the latter and silently did nothing. Confirmed by reading ACE-Step's own
  # source (acestep/api/startup_model_init.py): ACESTEP_INIT_SERVICE only
  # gets wired into the Gradio UI's CLI flags by the image's entrypoint
  # script; the API server (ACESTEP_MODE=api, what we actually run) reads
  # ACESTEP_NO_INIT directly and never sees ACESTEP_INIT_SERVICE at all --
  # both env vars exist in ACE-Step's own docs without making this
  # API-vs-Gradio distinction clear.
  #
  # Also pins ACESTEP_LM_MODEL_PATH explicitly: the image's own Dockerfile
  # default is the 4B LM, which this GPU's tier (tier3, 8GB) doesn't
  # support -- 0.6B is the only LM tier3 actually loads, so ask for it
  # directly rather than rely on request-time auto-selection now that
  # loading happens eagerly. (This one *is* read directly by the API
  # server's own startup code, unlike ACESTEP_INIT_SERVICE.)
  # `docker compose --profile audio up`.
  acestep:
    image: ghcr.io/ace-step/ace-step-1.5:latest
    profiles: ["audio"]
    environment:
      - ACESTEP_MODE=api
      - ACESTEP_NO_INIT=false
      - ACESTEP_LM_MODEL_PATH=acestep-5Hz-lm-0.6B
    ports:
      - "8001:8001"
    volumes:
      - acestep-checkpoints:/app/checkpoints
      - acestep-hf-cache:/root/.cache/huggingface
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # sound-effects/ -- built and validated (see docs/experiments/), unlike
  # machine-learning/ above this is real, working code we own, so this
  # entry is active rather than commented. Still gated behind the same
  # profile so it never starts unintentionally (CPU-capable per its
  # Dockerfile, but noticeably faster with a GPU -- add a `deploy:` block
  # matching acestep's above if you want to pass one through). Model
  # weights download from the HF Hub on first start and are cached in the
  # mounted volume across restarts. `docker compose --profile audio up`.
  #
  # stabilityai/stable-audio-open-1.0 is a *gated* HF repo -- downloading it
  # needs an authenticated token from an account that has accepted the
  # model's license on its Hugging Face page. HF_TOKEN below is substituted
  # from a local .env file (gitignored, never committed), which Compose
  # loads automatically -- never put the token directly in this file.
  sound-effects:
    build: ./sound-effects
    profiles: ["audio"]
    ports:
      - "8003:8003"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./data/sound-effects-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # image-generation/ -- Stable Diffusion XL, same shape as sound-effects/
  # above: built, own pyproject/Dockerfile, GPU passthrough from the start
  # (unlike sound-effects, which initially lacked it -- learned that lesson
  # already). A hosted API (Gemini's native image models) was tried first
  # and reverted: new Google AI Studio accounts require a non-refundable
  # minimum prepay to use it at all. `docker compose --profile image up`.
  image-generation:
    build: ./image-generation
    profiles: ["image"]
    ports:
      - "8005:8005"
    volumes:
      - ./data/image-generation-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Named (not bind-mounted) specifically to avoid a real, reproducible hang
  # reading large pre-existing checkpoint files through Docker Desktop's
  # WSL2 Windows-path file-sharing bridge -- see the acestep service's own
  # comment above and docs/experiments/.
  acestep-checkpoints:
  acestep-hf-cache:
