name: Test backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # No python-version input: setup-uv v10 removed `python-version-file`,
        # and uv reads .python-version itself when it resolves the project
        # environment -- so the pin still has exactly one source of truth.
        # Passing `python-version: "3.13"` here would work too, at the cost of
        # a second copy of the version that nothing keeps in step.

      - name: Install dependencies
        run: uv sync --extra server --extra generation

      # The version this project pins is a fact worth asserting, not assuming.
      # setup-uv v10 dropped the `python-version-file` input that used to
      # carry it, and an unknown input is only a warning -- so CI would have
      # gone on silently running whatever Python it liked. Comparing against
      # .python-version means the next such change fails instead of drifting.
      - name: Check the running Python matches .python-version
        run: |
          expected=$(cat .python-version)
          actual=$(uv run python -c             "import sys; print('.'.join(map(str, sys.version_info[:2])))")
          if [ "$expected" != "$actual" ]; then
            echo "::error::.python-version pins $expected but uv ran $actual"
            exit 1
          fi
          echo "Python $actual, as pinned."

      - name: Run tests
        run: uv run pytest --cov=src --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htmlcov
          path: htmlcov
