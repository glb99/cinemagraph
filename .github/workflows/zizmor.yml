name: Zizmor

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # No python-version input: setup-uv v10 removed `python-version-file`,
        # and uv reads .python-version itself when it resolves the project
        # environment -- so the pin still has exactly one source of truth.
        # Passing `python-version: "3.13"` here would work too, at the cost of
        # a second copy of the version that nothing keeps in step.

      - name: Run zizmor
        run: uv run zizmor .github/workflows/
