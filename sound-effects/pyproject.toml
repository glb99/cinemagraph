[project]
name = "sound-effects-service"
version = "0"
description = "Isolated FastAPI wrapper around Stable Audio Open for cinemagraph's sound-effect generation."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # numpy is used directly (see app.py) but deliberately not pinned here --
    # stable-audio-tools's own dependency chain (laion-clap) pins an exact
    # numpy version, and adding a second, looser constraint on top produced
    # a real ResolutionImpossible from pip. Whatever version that chain
    # resolves to is already what app.py runs against.
    "stable-audio-tools>=0.0.16",
    "einops>=0.7.0",
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
