[project]
name = "image-generation-service"
version = "0"
description = "Isolated FastAPI wrapper around Stable Diffusion XL for cinemagraph-tool's image generation."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
